[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proj-toolkit"
version = "0.1.0"
description = "CLI scaffolding tool for full-stack monorepos pre-configured for Claude Code agentic development"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "jinja2>=3.1",
    "rich>=13.0",
    "anthropic>=0.40",
]

[project.scripts]
proj-toolkit = "proj_toolkit.cli:app"

[project.optional-dependencies]
pdf = [
    "pypdf>=4.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "mypy",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/proj_toolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
